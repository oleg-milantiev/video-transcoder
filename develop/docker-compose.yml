services:
    nginx:
        restart: always
        image: nginx:1.28-alpine
        ports:
            - "80:80"
            - "443:443"
        depends_on:
            - php
        volumes:
            - ./symfony:/var/www/yc
            - ./100percents:/var/www/100
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
            # todo chown -R www-data:www-data и воркеры от www-data
            - storage:/storage

    cron:
        restart: always
        build:
            context: .
            dockerfile: ./docker/yc-php/Dockerfile
            target: dev
        user: "82:82"
        command: crond -f -l 2 -c /etc/crontabs
        env_file:
            - .env
        depends_on:
            - redis
            - postgres
        volumes:
            - ./symfony:/var/www/yc
            - ./crontabs:/etc/crontabs/root # alpine
            - storage:/storage

    php:
        restart: always
        build:
            context: .
            dockerfile: ./docker/yc-php/Dockerfile
            target: dev
        env_file:
            - .env
        environment:
            - PHP_IDE_CONFIG=serverName=yc.local
        depends_on:
            - redis
            - postgres
        expose:
            - 9000
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - ./symfony:/var/www/yc
            - storage:/storage

    php-100:
        restart: always
        build:
            context: .
            dockerfile: ./docker/yc-php-100/Dockerfile
            target: dev
        env_file:
            - .env
        environment:
            - PHP_IDE_CONFIG=serverName=100.local
        expose:
            - 9000
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - ./100percents:/var/www/100

    ffmpeg:
        restart: always
        build:
            context: ./docker/yc-ffmpeg
            dockerfile: ./Dockerfile
            target: dev
        user: "82:82"
        env_file:
            - .env
        environment:
            - PHP_IDE_CONFIG=serverName=yc.local
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            - redis
            - postgres
        command: sh -c '/var/www/yc/bin/console messenger:consume async -vvv'
        volumes:
            - ./symfony:/var/www/yc
            - storage:/storage

    ffmpeg-transcode:
        restart: always
        build:
            context: ./docker/yc-ffmpeg
            dockerfile: ./Dockerfile
            target: dev
        user: "82:82"
        env_file:
            - .env
        environment:
            - PHP_IDE_CONFIG=serverName=yc.local
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            - redis
            - postgres
        command: sh -c '/var/www/yc/bin/console messenger:consume async_transcode -vvv'
        deploy:
            replicas: 2
        volumes:
            - ./symfony:/var/www/yc
            - storage:/storage

    redis:
        restart: always
        image: redis:7
        ports:
            - "6379:6379"
        expose:
            - 6379

    postgres:
        restart: always
        image: docker.io/postgres:16.2
        shm_size: 1g
        ports:
            - "5432:5432"
        expose:
            - 5432
        command: postgres -c shared_preload_libraries=pg_stat_statements
        environment:
            - POSTGRES_USER=yc
            - POSTGRES_PASSWORD=yc
        volumes:
            - ./postgresql:/host
            - db-data:/var/lib/postgresql/data

    mercure:
        restart: always
        image: dunglas/mercure:v0.16
        environment:
            SERVER_NAME: ':80'
            MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_PUBLISHER_JWT_KEY}
            MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_SUBSCRIBER_JWT_KEY}
            MERCURE_EXTRA_DIRECTIVES: |
                cors_origins *
                anonymous 0
        ports:
            - '8080:80'
        expose:
            - 80

volumes:
    db-data:
    storage:

networks:
    appnet:
        driver: bridge
